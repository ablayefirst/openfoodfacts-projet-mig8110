<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container" style="max-width:520px;margin:40px auto;">
    <h2>Connexion Admin</h2>

    {% if error %}
      <div style="padding:10px;border:1px solid #c00;color:#c00;margin:10px 0;">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/admin/login">
      <label>Utilisateur</label>
      <input type="text" name="username" style="width:100%;padding:8px;margin:6px 0;" required>

      <label>Mot de passe</label>
      <input type="password" name="password" style="width:100%;padding:8px;margin:6px 0;" required>

      <button type="submit" style="padding:10px 16px;">Se connecter</button>
    </form>

    <p style="margin-top:18px;">
      <a href="/">← Retour au site</a>
    </p>
  </div>
</body>
</html>
