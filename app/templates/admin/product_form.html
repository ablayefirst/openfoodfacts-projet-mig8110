<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Produit</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container" style="max-width:820px;margin:30px auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h2>{{ title }}</h2>
      <div>
        <a href="/admin/products">← Liste</a>
        &nbsp; | &nbsp;
        <a href="/admin/logout">Se déconnecter</a>
      </div>
    </div>

    {% if error %}
      <div style="padding:10px;border:1px solid #c00;color:#c00;margin:10px 0;">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="{{ action }}">
      <label>Code produit</label>
      <input type="text" name="code_produit"
             value="{{ p.code_produit if p else '' }}"
             style="width:100%;padding:8px;margin:6px 0;"
             {% if is_edit %}readonly{% endif %} required>

      <label>Nom produit</label>
      <input type="text" name="nom_produit"
             value="{{ p.nom_produit if p else '' }}"
             style="width:100%;padding:8px;margin:6px 0;" required>

      <!-- ✅ MODIF 1 : Marque (ton modèle = Marque.brands, pas nom_marque) -->
      <div>
        <label>Marque</label>
        <input type="text"
               name="marque_nom"
               value="{{ p.marque.brands if p and p.marque else (p.brands if p and p.brands else '') }}"
               style="width:100%;padding:8px;margin:6px 0;">
      </div>

      <!-- ✅ MODIF 2 : Catégories -->
      <div>
        <label>Catégories (séparées par virgule)</label>
        <input type="text"
               name="categories_txt"
               value="{{ p.categories.replace(' | ', ', ') if p and p.categories else '' }}"
               style="width:100%;padding:8px;margin:6px 0;">
      </div>

      <!-- ✅ MODIF 3 : Ingrédients -->
      <div>
        <label>Ingrédients (séparés par virgule)</label>
        <input type="text"
               name="ingredients_txt"
               value="{{ p.ingredients_text.replace(' | ', ', ') if p and p.ingredients_text else '' }}"
               style="width:100%;padding:8px;margin:6px 0;">
      </div>

      <label>Nutrition grade (a..e)</label>
      <input type="text" name="nutrition_grade"
             value="{{ p.nutrition_grade if p else '' }}"
             style="width:100%;padding:8px;margin:6px 0;">

      <label>NutriScore score</label>
      <input type="number" name="nutriscore_score"
             value="{{ p.nutriscore_score if p and p.nutriscore_score is not none else '' }}"
             style="width:100%;padding:8px;margin:6px 0;">

      <button type="submit" style="padding:10px 16px;">Enregistrer</button>
    </form>
  </div>
</body>
</html>
